<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Large Translator - New Translation</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .container {
            max-width: 900px;
        }
        
        .translate-section {
            margin-bottom: 30px;
        }
        
        .file-selection {
            background: #f8f9fa;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .file-selection h3 {
            margin-top: 0;
            color: #333;
        }
        
        .file-selector {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .translation-config {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .config-group {
            background: #f8f9fa;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 20px;
        }
        
        .config-group h4 {
            margin-top: 0;
            color: #333;
        }
        
        .current-translation {
            margin-top: 40px;
        }
        
        .translation-status {
            background: #f8f9fa;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .status-title {
            font-weight: bold;
            color: #333;
        }
        
        .status-progress {
            margin: 12px 0;
        }
        
        .status-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        
        .navigation-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        
        @media (max-width: 768px) {
            .translation-config {
                grid-template-columns: 1fr;
            }
            
            .status-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .status-actions {
                flex-wrap: wrap;
            }
            
            .navigation-buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔤 New Translation</h1>
            <p>Create a new translation job and monitor its progress</p>
        </div>

        <!-- File Selection Section -->
        <div class="translate-section">
            <div class="file-selection">
                <h3>📄 Select File to Translate</h3>
                <select id="fileSelector" class="file-selector">
                    <option value="">Loading files...</option>
                </select>
            </div>

            <!-- Translation Configuration -->
            <div class="translation-config">
                <div class="config-group">
                    <h4>Translation Prompt</h4>
                    <div class="form-group">
                        <textarea 
                            id="translationPrompt" 
                            class="form-control" 
                            rows="4" 
                            placeholder="Enter your translation prompt (e.g., 'Translate to Spanish', 'Translate to French maintaining formal tone', etc.)"
                            required
                        ></textarea>
                    </div>
                </div>

                <div class="config-group">
                    <h4>Settings</h4>
                    <div class="form-group">
                        <label for="chunkSize">Chunk Size (characters)</label>
                        <input type="number" id="chunkSize" class="form-control" value="2000" min="500" max="5000">
                        <small class="form-text">Larger chunks may be slower but maintain better context. Smaller chunks process faster.</small>
                    </div>
                </div>
            </div>

            <!-- Start Translation Button -->
            <button id="startTranslationBtn" class="btn" data-original-text="🚀 Start Translation">
                🚀 Start Translation
            </button>
        </div>

        <!-- Current Translation Status Section -->
        <div class="current-translation" id="currentTranslationSection" style="display: none;">
            <div class="files-header">
                <h2>Current Translation Status</h2>
                <button class="refresh-btn" id="refreshStatusBtn">🔄 Refresh</button>
            </div>
            
            <div id="currentTranslationStatus">
                <!-- Current translation status will be displayed here -->
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="navigation-buttons">
            <a href="upload.html" class="btn btn-secondary">
                📁 Back to Upload
            </a>
            <a href="history.html" class="btn btn-secondary">
                📋 View Translation History
            </a>
        </div>
    </div>

    <script src="js/shared.js"></script>
    <script src="js/translate.js"></script>
</body>
</html>
