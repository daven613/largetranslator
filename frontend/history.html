<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Large Translator - Translation History</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .container {
            max-width: 1000px;
        }
        
        .history-section {
            margin-top: 30px;
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .history-header h2 {
            color: #333;
            margin: 0;
        }
        
        .refresh-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .refresh-btn:hover {
            background: #5a6268;
        }
        
        .job-item {
            background: #f8f9fa;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .job-title {
            font-weight: bold;
            color: #333;
            font-size: 1.1rem;
        }
        
        .job-details {
            margin: 12px 0;
            color: #666;
        }
        
        .job-details p {
            margin: 4px 0;
        }
        
        .job-progress {
            margin: 12px 0;
        }
        
        .job-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .navigation-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }
        
        .empty-state h3 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .filter-section {
            background: #f8f9fa;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 15px;
            align-items: end;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        
        .filter-group label {
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }
        
        @media (max-width: 768px) {
            .job-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .job-actions {
                flex-wrap: wrap;
            }
            
            .navigation-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .filter-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Translation History</h1>
            <p>View and manage all your translation jobs</p>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="statusFilter">Filter by Status</label>
                    <select id="statusFilter" class="form-control">
                        <option value="">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="in_progress">In Progress</option>
                        <option value="completed">Completed</option>
                        <option value="failed">Failed</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="sortBy">Sort By</label>
                    <select id="sortBy" class="form-control">
                        <option value="created_desc">Newest First</option>
                        <option value="created_asc">Oldest First</option>
                        <option value="status">Status</option>
                        <option value="progress">Progress</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="searchQuery">Search</label>
                    <input type="text" id="searchQuery" class="form-control" placeholder="Search translations...">
                </div>
                
                <div class="filter-group">
                    <button id="clearFiltersBtn" class="btn btn-secondary">Clear Filters</button>
                </div>
            </div>
        </div>

        <!-- Translation History Section -->
        <div class="history-section">
            <div class="history-header">
                <h2>All Translation Jobs</h2>
                <button class="refresh-btn" id="refreshHistoryBtn">🔄 Refresh</button>
            </div>
            
            <div id="translationHistoryList">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading translation history...
                </div>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="navigation-buttons">
            <a href="upload.html" class="btn btn-secondary">
                📁 Upload Files
            </a>
            <a href="translate.html" class="btn btn-primary">
                🔤 New Translation
            </a>
        </div>
    </div>

    <script src="js/shared.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
