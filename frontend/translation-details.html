<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Large Translator - Translation Details</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .container {
            max-width: 1400px;
        }
        
        .translation-header {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
        }
        
        .translation-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        
        .meta-item {
            display: flex;
            flex-direction: column;
        }
        
        .meta-label {
            font-weight: 500;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        .meta-value {
            font-weight: bold;
            color: #333;
        }
        
        .chunks-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .chunk-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background: #f8f9fa;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .chunk-panel {
            padding: 20px;
            background: white;
        }
        
        .chunk-panel.original {
            border-right: 1px solid #e1e5e9;
        }
        
        .chunk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e1e5e9;
        }
        
        .chunk-title {
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .chunk-title.original {
            color: #495057;
        }
        
        .chunk-title.translated {
            color: #28a745;
        }
        
        .chunk-sequence {
            background: #6c757d;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        
        .chunk-content {
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .chunk-content.original {
            color: #495057;
        }
        
        .chunk-content.translated {
            color: #333;
        }
        
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .loading-state .spinner {
            margin-bottom: 20px;
        }
        
        .error-state {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .missing-chunk {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 15px;
            border-radius: 4px;
            font-style: italic;
            text-align: center;
        }
        
        .navigation-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }
        
        .progress-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #666;
        }
        
        .progress-bar {
            width: 200px;
            height: 8px;
            background: #e1e5e9;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #28a745;
            transition: width 0.3s ease;
        }
        
        .chunk-pair {
            margin-bottom: 30px;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            background: #ffffff;
            overflow: hidden;
        }
        
        .chunk-pair.chunk-error {
            border-color: #dc3545;
            background: #fff8f8;
        }
        
        .chunk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e1e5e9;
        }
        
        .chunk-error .chunk-header {
            background: #f8d7da;
            border-bottom-color: #dc3545;
        }
        
        .chunk-number {
            font-weight: bold;
            color: #495057;
        }
        
        .chunk-sequence {
            color: #6c757d;
            font-size: 0.9em;
        }
        
        .error-indicator {
            color: #dc3545;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .chunks-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }
        
        .chunk-column {
            padding: 20px;
        }
        
        .chunk-column:first-child {
            border-right: 1px solid #e1e5e9;
        }
        
        .chunk-error .chunk-column:first-child {
            border-right-color: #dc3545;
        }
        
        .chunk-label {
            font-weight: bold;
            color: #495057;
            margin-bottom: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .chunk-content {
            background: #f8f9fa;
            border: 1px solid #e1e5e9;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 10px;
            line-height: 1.5;
            white-space: pre-wrap;
            font-family: Georgia, serif;
            min-height: 80px;
        }
        
        .chunk-content.error-content {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
        
        .chunk-info {
            font-size: 0.85em;
            color: #6c757d;
        }
        
        .error-details {
            padding: 15px 20px;
            background: #f8d7da;
            border-top: 1px solid #dc3545;
            color: #721c24;
        }
        
        .error-message {
            background: #ffffff;
            border: 1px solid #dc3545;
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.85em;
        }
        
        .error-display {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            text-align: center;
            color: #721c24;
        }
        
        .error-icon {
            font-size: 2em;
        }
        
        .error-summary {
            text-align: left;
        }
        
        .error-text {
            color: #6c757d;
            font-style: italic;
        }
        
        .placeholder-text {
            color: #6c757d;
            font-style: italic;
        }
        
        .error-summary {
            background: #f8d7da;
            border: 1px solid #dc3545;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            color: #721c24;
        }
        
        .error-summary h3 {
            margin: 0 0 10px 0;
            color: #721c24;
        }
        
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-in-progress {
            background: #cce7ff;
            color: #004085;
        }
        
        .status-completed {
            background: #d4edda;
            color: #155724;
        }
        
        .status-completed-with-errors {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }
        
        .text-warning {
            color: #856404;
        }
        
        .text-success {
            color: #155724;
        }
        
        #loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        
        #error-message {
            display: none;
            background: #f8d7da;
            border: 1px solid #dc3545;
            color: #721c24;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
        
        .back-button {
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .chunk-comparison {
                grid-template-columns: 1fr;
            }
            
            .chunk-panel.original {
                border-right: none;
                border-bottom: 1px solid #e1e5e9;
            }
            
            .translation-meta {
                grid-template-columns: 1fr;
            }
            
            .chunks-row {
                grid-template-columns: 1fr;
            }
            
            .chunk-column:first-child {
                border-right: none;
                border-bottom: 1px solid #e1e5e9;
            }
            
            .chunk-error .chunk-column:first-child {
                border-bottom-color: #dc3545;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Back to History Button -->
        <div class="back-button">
            <a href="history.html" class="btn btn-secondary">
                ← Back to Translation History
            </a>
        </div>

        <!-- Loading State -->
        <div id="loading">Loading translation details...</div>
        
        <!-- Error Message -->
        <div id="error-message"></div>

        <!-- Translation Header -->
        <div id="translation-header"></div>

        <!-- Chunks Comparison -->
        <div id="chunks-container"></div>
    </div>

    <script src="js/shared.js"></script>
    <script src="js/translation-details.js"></script>
</body>
</html>
